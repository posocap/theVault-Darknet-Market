name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (e.g. v0.2.0)
        required: true
      title:
        description: Release title
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
        run: |
          test -f RELEASE_NOTES.md
          gh release create "$TAG" --target main --title "$TITLE" --notes-file RELEASE_NOTES.md
